# CONFIGURAZIONE DATABASE POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bugboard
spring.datasource.username=postgres
spring.datasource.password=123456

# CONFIGURAZIONE HIBERNATE (JPA)
# "update" dice a Spring di creare o aggiornare automaticamente le tabelle nel DB partendo dalle tue classi Java
spring.jpa.hibernate.ddl-auto=update

# Mostra le query SQL nel terminale (utilissimo per il debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false